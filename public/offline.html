<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Klivr</title>
    <style>
      :root { --bg: #f8f9fb; --fg: #1d2024; --muted: #5f656d; --border: #d3d7dc; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0a0d10; --fg: #eceef1; --muted: #9aa0a8; --border: #33383e; }
      }
      body {
        margin: 0; min-height: 100vh; padding: 16px; box-sizing: border-box;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        background: var(--bg); color: var(--fg); text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .name { margin: 0 0 8px; font-size: 18px; font-weight: 600; letter-spacing: -0.04em; }
      h1 { margin: 0; font-size: 20px; font-weight: 600; }
      p { margin: 0; font-size: 14px; color: var(--muted); }
      button {
        margin-top: 12px; padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px;
        background: transparent; color: inherit; font: inherit; font-size: 14px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="name">klivr</div>
    <h1>You're offline</h1>
    <p>Klivr needs a connection. Your data is safe on your account.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </body>
</html>
